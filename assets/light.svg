  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#087F95"/><stop offset="1" stop-color="#516FD5"/></linearGradient>
  <clipPath id="portrait-clip"><rect x="690" y="38" width="464" height="365" rx="22"/></clipPath>
</defs>
